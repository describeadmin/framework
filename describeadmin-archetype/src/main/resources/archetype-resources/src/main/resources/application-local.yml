# 本地开发用的 profile。
#
#   docker run -d --name da-mysql -p ${dbPort}:3306 \
#     -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=${dbName} \
#     -e MYSQL_USER=${dbUsername} -e MYSQL_PASSWORD=${dbPassword} \
#     mysql:5.7 --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# ⚠️ 仅供本地开发：启动时自动执行数据库迁移（describeadmin.migration.mode=apply）。
#    首次启动时 dev-seed 会创建管理员 admin，口令【随机生成】——见启动日志或项目根目录的
#    .passwd 文件（已在 .gitignore 中）。仓库里没有任何固定默认口令。
#    真实环境请另建 application-dev.yml / application-prod.yml：迁移模式不写即为 validate
#    （只检查、有未执行的变更就拒绝启动），并且【不要】打开 describeadmin.system.dev-seed。

server:
  port: ${serverPort}

spring:
  datasource:
    url: jdbc:mysql://localhost:${dbPort}/${dbName}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${dbUsername}
    password: ${dbPassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

describeadmin:
  migration:
    # 启动时执行 src/main/resources/db/changelog/app/ 下所有未执行的 changelog。
    # 建表、菜单都在这里：用 codegen 生成的模块会产出 db/changelog/app/<时间戳>__<表名>.sql，
    # 放进去重启即可，【不需要在任何地方登记】。
    # 其他取值：validate（默认，只检查）/ print-sql（生成 SQL 交给 DBA）/ print-sync-sql / off
    mode: apply
    # 运行时 contexts。只在本地执行的数据（如演示数据）标 context:local
    contexts: local
  security:
    # 令牌有效期。本地调试放长一点，免得开着调试器就过期了
    token-ttl: 12h
    # allowed-origins 刻意留空：开发期走前端 dev server 的代理，从根本上不产生跨域，
    # 也就不存在「开发期放开的 CORS 被带上生产」这类事故
  system:
    dev-seed:
      # 只在本地开发打开：库里没有用户时创建管理员 admin，口令随机生成并写到项目根 .passwd。
      # ⚠️ application-dev.yml / application-prod.yml 里【不要】有这一段。
      enabled: true

logging:
  level:
    ${package}: DEBUG
    io.github.describeadmin: DEBUG
