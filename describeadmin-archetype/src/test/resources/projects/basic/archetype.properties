# archetype 自带的集成测试用例（mvn verify 时由 maven-archetype-plugin 自动执行）：
# 用这些参数生成一个工程，再对它执行 goal.txt 里的 goal。
#
# ⚠️ describeadminVersion 刻意钉死为【已发布到 Central 的版本】，而不是用本模块的当前版本。
#    IT 在 integration-test 阶段跑，此时本次构建的框架模块还没 install 到本地仓库，
#    若生成物引用 0.1.1-SNAPSHOT 之类，Maven 连模型都建不起来，IT 会以一个
#    与 archetype 本身无关的原因失败。发新版时把这一行更新为上一个已发布版本。
describeadminVersion=0.1.0

groupId=com.example.it
artifactId=archetype-it-app
version=1.0.0-SNAPSHOT
package=com.example.it.app

appClassName=DemoApplication
serverPort=8090
dbPort=3307
dbName=describeadmin
dbUsername=app
dbPassword=app
