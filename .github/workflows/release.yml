# framework 发布到 Maven Central
#
# 详细操作手册见元仓库 docs/RELEASE.md。
#
# 需要在 GitHub 组织/仓库 Secrets 中配置：
#   CENTRAL_TOKEN_USERNAME / CENTRAL_TOKEN_PASSWORD  Central Portal User Token
#   GPG_PRIVATE_KEY / GPG_PASSPHRASE                 GPG 私钥与口令
#
# 触发：打 tag v* 自动发布；或手动触发（默认 dry-run，只验证签名不上传）。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只验证打包与签名，不上传到 Central'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    # 建议在仓库设置里给该 environment 加 Required reviewers。
    # Maven Central 的版本不可撤回、不可覆盖，这道人工闸门值得保留。
    environment: maven-central
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: 校验 tag 与 POM 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag="${GITHUB_REF#refs/tags/v}"
          pom=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "tag=$tag  pom=$pom"
          if [ "$tag" != "$pom" ]; then
            echo "::error::tag v$tag 与 POM 版本 $pom 不一致，拒绝发布"; exit 1
          fi
          case "$pom" in
            *-SNAPSHOT) echo "::error::不能发布 SNAPSHOT 版本到 Central"; exit 1 ;;
          esac

      - name: 构建 + 签名（不上传）
        run: mvn -B clean verify -Prelease
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: 校验签名与附属产物齐备
        run: |
          set -e
          fail=0
          for m in framework-common framework-web-starter framework-security-starter \
                   framework-mybatis-starter framework-system-starter; do
            [ -d "$m/target" ] || continue
            for suffix in ".jar" "-sources.jar" "-javadoc.jar"; do
              f=$(ls "$m"/target/*"$suffix" 2>/dev/null | grep -v '\.asc$' | head -1)
              if [ -z "$f" ]; then echo "::error::$m 缺少 $suffix"; fail=1; continue; fi
              if [ ! -f "$f.asc" ]; then echo "::error::$f 缺少 GPG 签名"; fail=1; fi
            done
          done
          [ $fail -eq 0 ] && echo "  ✓ 全部模块的 jar / sources / javadoc 及其签名齐备"
          exit $fail

      - name: 上传到 Central Portal（draft）
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: mvn -B deploy -Prelease -DskipTests
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: 后续手工步骤提示
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          echo "制品已上传为 draft。"
          echo "请前往 https://central.sonatype.com/publishing/deployments 确认后手动 Publish。"
