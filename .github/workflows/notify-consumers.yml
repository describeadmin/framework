# framework 合入 main 后，触发下游消费者仓库的兼容性门禁。
#
# 多仓拓扑下，框架自己的 CI 绿不代表消费者没被破坏 —— 必须主动通知下游验证。
# 单仓时这是自动的，拆仓后需要显式编排。

name: Notify consumers

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 sample-app 兼容性门禁
        env:
          # 需要一个有 describeadmin/sample-app 仓库 dispatch 权限的 PAT
          TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/describeadmin/sample-app/dispatches \
            -d '{"event_type":"framework-updated","client_payload":{"framework_ref":"${{ github.sha }}"}}'
