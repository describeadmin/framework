# framework 仓库 CI
#
# 本仓库自成体系：只构建与测试 framework 自身，不引用任何其他仓库。
# 「业务方视角」的验证（BOM 仲裁、双版本集成测试）在 sample-app 仓库的 CI 中进行——
# 那里才是真实消费者的位置，放在本仓库里验证等于自己给自己发合格证。

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 构建（JDK 21 → release 17）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 构建
        run: mvn -B clean install -DskipTests

      - name: 校验字节码版本为 61（Java 17）
        run: |
          set -e
          fail=0
          for m in framework-common framework-web-starter framework-security-starter \
                   framework-mybatis-starter framework-system-starter; do
            [ -d "$m/target/classes" ] || continue
            cls=$(find "$m/target/classes" -name '*.class' | head -1)
            ver=$(javap -v -p "$cls" | grep -m1 'major version' | grep -oE '[0-9]+')
            if [ "$ver" != "61" ]; then
              echo "::error::$m 字节码版本为 $ver，期望 61（Java 17）"; fail=1
            else
              echo "  ✓ $m -> major version $ver"
            fi
          done
          exit $fail

      - name: 校验依赖树中无 JDBC 驱动
        run: |
          # 框架不得引入任何驱动（develop_plan.md 2.3.2）；enforcer 已有规则，此处做可见性检查
          if mvn -B dependency:tree | grep -iE 'mysql-connector|mariadb-java-client|oceanbase-client'; then
            echo "::error::框架依赖树中出现 JDBC 驱动"; exit 1
          fi
          echo "  ✓ 无 JDBC 驱动"

      - name: 单元测试
        run: mvn -B test

      - uses: actions/upload-artifact@v4
        with:
          name: framework-jars
          path: '*/target/*.jar'
          retention-days: 7
